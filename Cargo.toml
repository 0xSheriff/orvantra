[workspace]
resolver = "2"
members = ["contracts/vendor-registry", "contracts/treasury", "contracts/test-token"]

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
near-sdk = "5.30"
near-contract-standards = "5.30"
near-workspaces = "0.24"
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"

# Size-optimised release profile for wasm contracts.
[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
