[package]
name = "vendor-registry"
description = "Orvantra vendor registry: vendors publish their own payout details on NEAR"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { workspace = true }

[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing"] }

# The near-workspaces sandbox binary is not published for Intel macOS (its build script panics
# there), so the integration test and its dependencies are only built on supported platforms.
# On Intel macOS, opt in with your own sandbox binary:
#   RUSTFLAGS="--cfg orvantra_sandbox" NEAR_SANDBOX_BIN_PATH=/path/to/near-sandbox cargo test
[target.'cfg(any(orvantra_sandbox, not(all(target_os = "macos", target_arch = "x86_64"))))'.dev-dependencies]
near-workspaces = { workspace = true, features = ["unstable"] }
tokio = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(orvantra_sandbox)"] }
